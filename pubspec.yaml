name: ict_hub_flutter
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cached_network_image: ^4.0.0
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  go_router: ^18.0.1
  image_picker: ^1.2.3

dev_dependencies:

  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true

  assets:
    - assets/images/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Black.ttf
        - asset: assets/fonts/Cairo-Regular.ttf
